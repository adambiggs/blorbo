<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blorbo phone check</title>
<style>
  :root { --glyph: 232,230,223; --glyph-gain: 1; --glyph-floor: 0.025; --ring: 255,221,0; color: #eceae3; background: #182a35; font: 16px/1.5 system-ui }
  body { min-height: 180vh; margin: 0 }
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(135deg,#182a35,#254758,#142a35) }
  .bgfx canvas { position: absolute; inset: 0; width: 100%; height: 100% }
  main { position: relative; z-index: 1; padding: 2rem; max-width: 36rem }
  h1 { font-size: 3rem; line-height: 1.1 }
  button { font: inherit; padding: .6rem 1rem }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #142a35cc }
</style>
<div class="bgfx" aria-hidden="true"><canvas id="blorbo"></canvas></div>
<main>
  <h1 data-blob="words">Phone check</h1>
  <p>Hold the phone still and run this check. It samples the field for about three seconds.</p>
  <button id="run" type="button">Run measurement</button>
  <pre id="result" aria-live="polite">Ready.</pre>
</main>
<script type="module">
  import { createBlorbo, presets } from '../src/index.js';
  const result = document.getElementById('result');
  document.getElementById('run').addEventListener('click', async () => {
    result.textContent = 'Measuring…';
    const blorbo = createBlorbo(document.getElementById('blorbo'), { preset: presets.adambiggs, persist: false });
    const samples = [], intervals = [];
    let previous = 0;
    for (let i = 0; i < 180; i++) {
      const now = await new Promise((done) => requestAnimationFrame(done));
      if (i >= 30) {
        samples.push(blorbo.stats.lastFrameMs);
        if (previous) intervals.push(now - previous);
      }
      previous = now;
    }
    const sorted = (a) => a.slice().sort((x, y) => x - y);
    const p95 = (a) => sorted(a)[Math.floor((a.length - 1) * .95)];
    const report = {
      viewport: `${innerWidth}x${innerHeight}`,
      dpr: devicePixelRatio,
      frameCostMeanMs: +(samples.reduce((a, b) => a + b, 0) / samples.length).toFixed(2),
      frameCostP95Ms: +p95(samples).toFixed(2),
      frameIntervalP95Ms: +p95(intervals).toFixed(2),
      quality: blorbo.stats.quality,
      userAgent: navigator.userAgent,
    };
    blorbo.destroy();
    result.textContent = JSON.stringify(report, null, 2);
  });
</script>
</html>
