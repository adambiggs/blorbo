<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blorbo MIDI demo</title>
<style>
  :root { --glyph: 232,230,223; --glyph-gain: 1; --glyph-floor: 0.025; --ring: 255,221,0; color: #eceae3; background: #182a35; font: 16px/1.5 system-ui }
  body { min-height: 180vh; margin: 0; }
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(135deg,#182a35,#254758,#142a35); }
  .bgfx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  main { position: relative; z-index: 1; max-width: 42rem; padding: 4rem 2rem; }
  h1 { font-size: clamp(3rem,10vw,6rem); line-height: 1; }
  button, input { font: inherit; }
  button { padding: .6rem 1rem; }
  label { display: block; margin: 1.5rem 0; }
  input[type=range] { display: block; width: min(28rem,100%); }
</style>
<div class="bgfx" aria-hidden="true"><canvas id="blorbo"></canvas></div>
<main>
  <h1 data-blob="words">Blorbo</h1>
  <p>Move the knob to change the field’s drift and brightness. MIDI CC 1 controls the same sweep; note-on messages pulse the field.</p>
  <button id="midi" type="button">Enable MIDI</button>
  <p id="status" role="status">MIDI is off.</p>
  <label>Knob <input id="knob" type="range" min="0" max="127" value="0"></label>
  <button id="note" type="button">Play a note</button>
</main>
<script type="module">
  import { createBlorbo, presets } from '../src/index.js';
  const blorbo = createBlorbo(document.getElementById('blorbo'), {
    preset: presets.adambiggs,
    overrides: {
      midiPulse: true,
      mapSignals(bus) {
        const knob = bus.get('midi.cc.1') ?? 0;
        return { drift: 14 + 70 * knob, gain: 1 + 0.7 * knob };
      },
    },
  });
  document.getElementById('midi').addEventListener('click', async () => {
    const enabled = await blorbo.enableMIDI();
    document.getElementById('status').textContent = enabled ? 'MIDI is ready. Move CC 1 or play notes.' : 'MIDI is unavailable in this browser or permission was declined.';
  });
  document.getElementById('knob').addEventListener('input', (event) => blorbo.setSignal('midi.cc.1', Number(event.target.value) / 127));
  document.getElementById('note').addEventListener('click', () => blorbo.pushSignal('midi.note', { note: 60, velocity: 1, on: true, channel: 0 }));
</script>
</html>
