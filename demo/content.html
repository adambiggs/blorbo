<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blorbo page content demo</title>
<style>
  :root { --glyph: 232,230,223; --glyph-gain: 1; --glyph-floor: 0.025; --ring: 255,221,0; color: #eceae3; background: #182a35; font: 18px/1.6 system-ui }
  body { min-height: 150vh; margin: 0 }
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(135deg,#182a35,#254758,#142a35) }
  .bgfx canvas { position: absolute; inset: 0; width: 100%; height: 100% }
  main { position: relative; z-index: 1; max-width: 42rem; padding: 4rem 2rem }
  h1 { font-size: clamp(3rem,10vw,6rem); line-height: 1 }
  button { font: inherit; padding: .6rem 1rem }
  .copy { max-width: 32rem; margin: 3rem 0 }
</style>
<div class="bgfx" aria-hidden="true"><canvas id="blorbo"></canvas></div>
<main>
  <h1 data-blob="words">Page content shapes Blorbo</h1>
  <p class="copy">This text pushes the background field aside. The marked heading gathers soft bodies behind each word.</p>
  <button id="toggle" type="button">Add a paragraph</button>
  <p class="copy" id="extra" hidden>New page content clears space in the field. Remove it and the background flows back.</p>
</main>
<script type="module">
  import { createBlorbo, presets } from '../src/index.js';

  const blorbo = createBlorbo(document.getElementById('blorbo'), {
    preset: presets.adambiggs,
  });
  const extra = document.getElementById('extra');
  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    extra.hidden = !extra.hidden;
    toggle.textContent = extra.hidden ? 'Add a paragraph' : 'Remove the paragraph';
    blorbo.remeasure();
  });
</script>
</html>
